[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wetconn"
version = "0.1.0"
description = "Probability that wetlands connect to a drainage network"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "numba",
    "rasterio",
    "geopandas",
    "pyogrio",
    "shapely>=2",
]

[project.optional-dependencies]
test = ["pytest", "scikit-image", "scipy"]

[tool.setuptools]
packages = ["wetconn", "wetland_drainage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::PendingDeprecationWarning:rasterio",
    "ignore:Use `@` matmul:PendingDeprecationWarning",
]
